<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Settings Hub</title>
    <style>
        /* =========================================
           TWITCH STYLE CSS (Unverä ndert)
           ========================================= */
        :root {
            --bg-color: #0e0e10;
            --card-bg: #18181b;
            --card-hover: #1f1f23;
            --primary: #9146FF;
            --primary-hover: #a970ff;
            --text-main: #ffffff;
            --text-muted: #adadb8;
        }

        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; padding: 20px; box-sizing: border-box; }
        h1 { text-align: center; color: var(--primary); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; font-size: 1.8rem; }
        
        #grid-view { display: flex; flex-direction: column; gap: 20px; max-width: 650px; margin: 0 auto; }
        .game-card { 
            background-color: var(--card-bg); 
            border-radius: 12px; /* Minimal runder für einen modernen Look */
            overflow: hidden; 
            /* Subtiler, halbtransparenter Rand statt unsichtbarer Border */
            border: 1px solid rgba(255, 255, 255, 0.05); 
            box-shadow: 0 8px 20px rgba(0,0,0,0.5); 
            /* Hochwertige, weiche Animations-Kurve */
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
            cursor: pointer; 
            width: 100%; 
        }

        .game-card:hover { 
            background-color: var(--card-hover); 
            /* Das ist der lila Glow-Effekt nach außen */
            box-shadow: 0 10px 25px rgba(0,0,0,0.6), 0 0 20px rgba(145, 70, 255, 0.4);
            border-color: rgba(145, 70, 255, 0.5);
            /* Die Karte "schwebt" beim Hovern leicht nach oben */
            transform: translateY(-4px); 
        }
        .game-banner { width: 100%; height: 180px; background-size: cover; background-position: center; border-bottom: 3px solid var(--primary); }
        .game-title { padding: 15px 20px; font-size: 1.3rem; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        
        .toggle-icon { font-size: 0.9rem; color: var(--primary); transition: transform 0.3s ease; }
        .game-card.expanded .toggle-icon { transform: rotate(180deg); }

        .game-content-wrapper { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.4s ease-out; background-color: var(--card-bg); }
        .game-card.expanded .game-content-wrapper { grid-template-rows: 1fr; }
        .game-content-inner { overflow: hidden; }
        .game-content-padding { padding: 0 20px 20px 20px; color: var(--text-muted); font-size: 0.95rem; }

        #standalone-view { display: none; max-width: 650px; margin: 0 auto; }
        .home-btn { 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-bottom: 20px; 
            display: inline-flex; 
            align-items: center; 
            text-decoration: none; 
            width: 100%; 
            justify-content: center; 
            /* Leichter Basis-Glow */
            box-shadow: 0 4px 15px rgba(145, 70, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
        }

        .home-btn:hover { 
            background-color: var(--primary-hover); 
            /* Hebt sich leicht und verstärkt den Glow */
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(145, 70, 255, 0.6);
        }
        .standalone-card { 
            background-color: var(--card-bg); 
            border-radius: 12px; 
            overflow: hidden; 
            /* Gleicher moderner Rand und Glow wie bei den kleinen Karten */
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 4px solid var(--primary); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 30px rgba(145, 70, 255, 0.15); 
        }
        .standalone-banner { width: 100%; height: 200px; background-size: cover; background-position: center; }
        .standalone-content { padding: 20px; color: var(--text-muted); }

        a { color: var(--primary-hover); text-decoration: none; }
        a:hover { text-decoration: underline; }
        img { max-width: 100%; border-radius: 6px; margin-top: 10px; }
        ul { padding-left: 20px; }
        h3 { color: var(--text-main); margin-bottom: 10px; }
        p { 
            margin-top: 0; 
            margin-bottom: 0; 
            line-height: 1.5; 
        }
    </style>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>

    <h1 id="main-title">My Game Settings</h1>
    <div id="grid-view"></div>
    <div id="standalone-view">
        <button class="home-btn" onclick="goHome()">← Zurück zur Spielauswahl</button>
        <div class="standalone-card" id="standalone-card-container"></div>
    </div>

    <script>
        // Lädt die Datei bei JEDEM Seitenaufruf garantiert neu
        var script = document.createElement('script');
        script.src = 'games.js?t=' + new Date().getTime();
        
        // NEU: Sag dem Browser, er soll warten, bis die Datei geladen ist
        script.onload = function() {
            handleRouting(); // Erst JETZT die Spiele aufbauen!
        };
        
        document.body.appendChild(script);
    </script>

    <script>
        const gridView = document.getElementById('grid-view');
        const standaloneView = document.getElementById('standalone-view');
        const standaloneCard = document.getElementById('standalone-card-container');
        const mainTitle = document.getElementById('main-title');

        function getImageUrl(game) {
            // Wenn ein eigener Link in der games.js steht, nutze diesen:
            if (game.imageUrl) {
                return game.imageUrl;
            }
            // Ansonsten nutze standardmäßig das Steam-Bild:
            return `https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/${game.steamAppId}/header.jpg`;
        }

        function renderGrid() {
            gridView.innerHTML = ''; 
            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="game-banner" style="background-image: url('${getImageUrl(game)}')"></div>
                    <div class="game-title">
                        ${game.title}
                        <span class="toggle-icon">▼</span>
                    </div>
                    <div class="game-content-wrapper">
                        <div class="game-content-inner">
                            <div class="game-content-padding">
                                ${game.content}
                                <div style="margin-top: 20px; text-align: right; border-top: 1px solid #333; padding-top: 15px;">
                                    <a href="#${game.id}" onclick="event.stopPropagation()">↗ Im Vollbild öffnen</a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                card.addEventListener('click', () => card.classList.toggle('expanded'));
                gridView.appendChild(card);
            });
        }

        function renderStandalone(gameId) {
            const game = games.find(g => g.id === gameId);
            if (!game) { goHome(); return; }
            standaloneCard.innerHTML = `
                <div class="standalone-banner" style="background-image: url('${getImageUrl(game)}')"></div>
                <div class="standalone-content">
                    <h2 style="color: var(--text-main); margin-top: 0; font-size: 1.5rem;">${game.title}</h2>
                    ${game.content}
                </div>
            `;
        }

        function handleRouting() {
            const hash = window.location.hash.substring(1); 
            if (hash) {
                gridView.style.display = 'none';
                mainTitle.style.display = 'none';
                standaloneView.style.display = 'block';
                window.scrollTo(0, 0); 
                renderStandalone(hash);
            } else {
                gridView.style.display = 'flex';
                mainTitle.style.display = 'block';
                standaloneView.style.display = 'none';
                renderGrid();
            }
        }

        function goHome() { window.location.hash = ''; }
        window.addEventListener('hashchange', handleRouting);
        // HIER WURDE handleRouting(); GELÖSCHT
    </script>
</body>
</html>
